<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLL Mission Planner</title>
<style>
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eef1ec; --ink:#1b2420; --muted:#5b6862;
  --line:#d5dbd6; --red:#d32f2f; --red-soft:#fde8e8; --blue:#1f6feb; --blue-soft:#e3eefe;
  --green:#2e7d32; --accent:#c62828; --shadow:0 8px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141917; --surface:#1d2421; --surface-2:#252e2a; --ink:#e8eeea; --muted:#a2b0a9;
    --line:#34403b; --red-soft:#3a1c1c; --blue-soft:#172a45; --shadow:0 8px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --surface-2:#252e2a; --ink:#e8eeea; --muted:#a2b0a9;
  --line:#34403b; --red-soft:#3a1c1c; --blue-soft:#172a45; --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1.25rem;letter-spacing:.2px}
header h1 span{color:var(--accent)}
.fields{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}
.fields label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.fields input{font:inherit;font-size:.95rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);width:180px}
main{display:flex;gap:16px;padding:16px;align-items:flex-start}
.map-col{flex:1;min-width:0}
.hint{margin:0 0 8px;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:.95rem;min-height:2.4em}
.hint b{color:var(--accent)}
.map-wrap{position:relative;width:100%;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);background:#2a3a30;user-select:none;-webkit-user-select:none}
.map-wrap img{display:block;width:100%;height:auto}
.map-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.zone{cursor:pointer;transition:fill .15s}
.zone.red{fill:rgba(211,47,47,0)} .zone.red:hover{fill:rgba(211,47,47,.18)}
.zone.blue{fill:rgba(31,111,235,0)} .zone.blue:hover{fill:rgba(31,111,235,.18)}
.spot{cursor:pointer;fill:rgba(255,255,255,0);stroke:rgba(255,255,255,0);stroke-width:10;transition:all .15s}
.spot:hover{fill:rgba(255,235,59,.22);stroke:#ffeb3b}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:26px;height:5px;border-radius:3px;vertical-align:middle;margin-right:6px}
aside{width:340px;flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.total{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line)}
.total .lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.total .num{font-size:2.4rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.start-pts{font-size:.85rem;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line)}
.start-pts div{display:flex;justify-content:space-between}
ol.steps{list-style:none;margin:0;padding:6px 0;overflow-y:auto;flex:1;min-height:80px}
ol.steps li{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:.92rem}
ol.steps li .n{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:#fff}
ol.steps li .t{flex:1}
ol.steps li .p{font-weight:700;font-variant-numeric:tabular-nums}
ol.steps li.launch .t{font-weight:600}
.empty{color:var(--muted);font-size:.9rem;padding:10px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:10px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:9px 12px;font-weight:600}
button:hover{filter:brightness(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;grid-column:1/-1;font-size:1.05rem;padding:12px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.show{display:flex}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:440px;padding:20px}
.modal h2{margin:0 0 6px;font-size:1.2rem}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal .choices{display:flex;flex-wrap:wrap;gap:8px}
.modal .choices button{flex:1 1 auto;min-width:72px}
.modal .choices button.pts{font-size:1.1rem;background:var(--blue-soft);border-color:var(--blue)}
.modal .choices button.mis{flex:1 1 100%;text-align:left;background:var(--blue-soft);border-color:var(--blue)}
.modal .choices button.ok{background:var(--accent);border-color:var(--accent);color:#fff}
.modal .choices button.cancel{flex:1 1 100%;background:transparent}
.result{max-width:1100px}
.result img{width:100%;border-radius:6px;border:1px solid var(--line);max-height:65vh;object-fit:contain;background:#fff}
@media (max-width:900px){
  main{flex-direction:column}
  aside{width:100%;position:static;max-height:none}
  .fields{margin-left:0}
}
</style>
</head>
<body>
<header>
  <h1>FLL <span>Mission Planner</span></h1>
  <div class="fields">
    <label>Team name / number<input id="team" placeholder="e.g. Team 12345"></label>
    <label>Run<input id="run" placeholder="e.g. Round 1"></label>
  </div>
</header>

<main>
  <div class="map-col">
    <p class="hint" id="hint"></p>
    <div class="map-wrap" id="mapWrap">
      <img id="mapImg" src="map.jpg" alt="FLL Challenge field map" crossorigin="anonymous">
      <svg id="svg" viewBox="0 0 3600 2037" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>Drive to a mission</span>
      <span><i style="background:var(--red)"></i>Return to a launch area</span>
      <span>Missions 13, 14 &amp; 15 go in the white boxes — you choose which goes where.</span>
    </div>
  </div>

  <aside>
    <div class="total"><span class="lbl">Planned total</span><span class="num" id="total">90</span></div>
    <div class="start-pts">
      <div><span>Precision tokens</span><b>50</b></div>
      <div><span>Equipment inspection</span><b>20</b></div>
      <div><span>M10 Fragile Microhabitats</span><b>20</b></div>
    </div>
    <ol class="steps" id="steps"></ol>
    <div class="btns">
      <button id="undoBtn">↶ Undo last</button>
      <button id="clearBtn">Start over</button>
      <button class="primary" id="calcBtn">Calculate</button>
    </div>
  </aside>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
const W = 3600, H = 2037, BOX = 175, START_POINTS = 90;
const NS = 'http://www.w3.org/2000/svg';
const COLORS = { blue: '#1f6feb', red: '#e0241b' };

const MISSIONS = {
  1:  { name: 'Drone Survey',            pts: [20, 30] },
  2:  { name: 'Exploding Seeds',         pts: [10, 20, 30] },
  3:  { name: 'Flip the Rock',           pts: [20, 30] },
  4:  { name: 'Lucky Leaves',            pts: [10, 30] },
  5:  { name: 'Reaching Roots',          pts: [10, 20] },
  6:  { name: 'Leafcutter Frenzy',       pts: [10, 20, 30, 40] },
  7:  { name: 'Humongous Fungus',        pts: [20] },
  8:  { name: 'Tangled',                 pts: [30] },
  9:  { name: 'Research Platform',       pts: [10, 20, 30] },
  11: { name: 'Windows to the Past',     pts: [20] },
  12: { name: 'Forest Elder',            pts: [10, 20, 30] },
  13: { name: 'Keystone Species',        pts: [30] },
  14: { name: 'Seeds of Renewal',        pts: [5, 10, 15, 20, 25, 30, 35, 40] },
  15: { name: 'Biocentric Architecture', pts: [10, 20, 30, 40] },
};

// Box centres measured from the numbered map (3600 x 2037 pixels)
const SPOTS = [
  { id: 'm1',  mission: 1,  x: 1576, y: 1887 },
  { id: 'm2',  mission: 2,  x: 1142, y: 1062 },
  { id: 'm3',  mission: 3,  x: 169,  y: 830 },
  { id: 'm4',  mission: 4,  x: 277,  y: 271 },
  { id: 'm5',  mission: 5,  x: 716,  y: 144 },
  { id: 'm6',  mission: 6,  x: 2713, y: 141 },
  { id: 'm7',  mission: 7,  x: 2940, y: 141 },
  { id: 'm8',  mission: 8,  x: 967,  y: 144 },
  { id: 'm9',  mission: 9,  x: 1180, y: 144 },
  { id: 'm11', mission: 11, x: 2516, y: 963 },
  { id: 'm12', mission: 12, x: 3445, y: 677 },
  { id: 'wA',  white: true, x: 3394, y: 205,  label: 'top-right white box' },
  { id: 'wB',  white: true, x: 1784, y: 916,  label: 'center white box' },
  { id: 'wC',  white: true, x: 2306, y: 1868, label: 'bottom white box' },
];
const spotById = Object.fromEntries(SPOTS.map(s => [s.id, s]));

const LAUNCH = {
  red:  { cx: 0, cy: H, r: 870, name: 'Red Launch Area',  color: COLORS.red },
  blue: { cx: W, cy: H, r: 870, name: 'Blue Launch Area', color: COLORS.blue },
};

let path = []; // {kind:'launch', side, x, y} | {kind:'mission', spot, mission, points, revisit}

const pad = n => String(n).padStart(2, '0');
const svg = document.getElementById('svg');
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};

/* ---------- derived state ---------- */
function whiteAssignments() {
  const a = {};
  for (const n of path) if (n.kind === 'mission' && spotById[n.spot].white && !(n.spot in a)) a[n.spot] = n.mission;
  return a;
}
function scoredPoints(mission) {
  const n = path.find(p => p.kind === 'mission' && p.mission === mission && !p.revisit);
  return n ? n.points : null;
}
function total() {
  return START_POINTS + path.reduce((s, n) => s + (n.kind === 'mission' && !n.revisit ? n.points : 0), 0);
}
function nodeXY(n) { return n.kind === 'launch' ? { x: n.x, y: n.y } : { x: spotById[n.spot].x, y: spotById[n.spot].y }; }
function nodeKey(n) { return n.kind === 'launch' ? 'L-' + n.side : n.spot; }
function nodeLabel(n) {
  if (n.kind === 'launch') return LAUNCH[n.side].name;
  return 'M' + pad(n.mission) + ' ' + MISSIONS[n.mission].name;
}

// Segment geometry shared by the screen and the downloaded image
function segments() {
  const segs = [], pairCount = {};
  for (let i = 1; i < path.length; i++) {
    const a = path[i - 1], b = path[i];
    const pa = nodeXY(a), pb = nodeXY(b);
    const key = [nodeKey(a), nodeKey(b)].sort().join('|');
    const k = pairCount[key] = (pairCount[key] || 0) + 1;
    const dx = pb.x - pa.x, dy = pb.y - pa.y, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    // offset repeated trips between the same two places so they don't sit on top of each other
    const off = k === 1 ? 0 : (k % 2 === 0 ? 1 : -1) * Math.ceil((k - 1) / 2) * 45;
    const ox = -uy * off, oy = ux * off;
    const trimA = a.kind === 'mission' ? BOX * 0.62 : 30;
    const trimB = b.kind === 'mission' ? BOX * 0.62 : 30;
    const x1 = pa.x + ux * trimA + ox, y1 = pa.y + uy * trimA + oy;
    const x2 = pb.x - ux * trimB + ox, y2 = pb.y - uy * trimB + oy;
    const color = b.kind === 'mission' ? COLORS.blue : COLORS.red; // to a mission = blue, to a launch area = red
    segs.push({ x1, y1, x2, y2, ux, uy, color, step: i + 1 }); // matches the destination's number in the list
  }
  return segs;
}

/* ---------- drawing on screen ---------- */
function render() {
  svg.innerHTML = '';
  // launch zones
  for (const side of ['red', 'blue']) {
    const L = LAUNCH[side];
    const d = side === 'red'
      ? `M0 ${H} L0 ${H - L.r} A${L.r} ${L.r} 0 0 1 ${L.r} ${H} Z`
      : `M${W} ${H} L${W} ${H - L.r} A${L.r} ${L.r} 0 0 0 ${W - L.r} ${H} Z`;
    const z = el('path', { d, class: 'zone ' + side }, svg);
    el('title', {}, z).textContent = L.name;
    z.addEventListener('click', e => onLaunchClick(side, e));
  }

  const assign = whiteAssignments();
  const visited = new Set(path.filter(n => n.kind === 'mission').map(n => n.spot));

  // visited rings + white box labels
  for (const s of SPOTS) {
    if (visited.has(s.id)) el('rect', { x: s.x - BOX / 2 - 14, y: s.y - BOX / 2 - 14, width: BOX + 28, height: BOX + 28, rx: 34, fill: 'none', stroke: '#ffeb3b', 'stroke-width': 12 }, svg);
    if (s.white && assign[s.id]) {
      const t = el('text', { x: s.x, y: s.y + 42, 'text-anchor': 'middle', 'font-size': 112, 'font-weight': 800, fill: '#c62828', 'font-family': 'system-ui,Arial,sans-serif' }, svg);
      t.textContent = pad(assign[s.id]);
    }
  }

  // lines
  const g = el('g', { 'pointer-events': 'none' }, svg);
  for (const s of segments()) {
    el('line', { x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2, stroke: '#fff', 'stroke-width': 26, 'stroke-linecap': 'round' }, g);
    el('line', { x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2, stroke: s.color, 'stroke-width': 15, 'stroke-linecap': 'round' }, g);
    const ah = arrowHead(s);
    el('polygon', { points: ah.map(p => p.join(',')).join(' '), fill: s.color, stroke: '#fff', 'stroke-width': 6, 'stroke-linejoin': 'round' }, g);
    const mx = (s.x1 + s.x2) / 2, my = (s.y1 + s.y2) / 2;
    el('circle', { cx: mx, cy: my, r: 38, fill: s.color, stroke: '#fff', 'stroke-width': 7 }, g);
    const t = el('text', { x: mx, y: my + 17, 'text-anchor': 'middle', 'font-size': 48, 'font-weight': 800, fill: '#fff', 'font-family': 'system-ui,Arial,sans-serif' }, g);
    t.textContent = s.step;
  }
  // launch markers
  path.forEach((n, i) => {
    if (n.kind !== 'launch') return;
    el('circle', { cx: n.x, cy: n.y, r: i === 0 ? 40 : 28, fill: LAUNCH[n.side].color, stroke: '#fff', 'stroke-width': 9 }, g);
  });

  // mission click targets (on top)
  for (const s of SPOTS) {
    const r = el('rect', { x: s.x - BOX / 2, y: s.y - BOX / 2, width: BOX, height: BOX, rx: 30, class: 'spot' }, svg);
    let tip = s.white ? (assign[s.id] ? `M${pad(assign[s.id])} ${MISSIONS[assign[s.id]].name}` : 'White box — choose Mission 13, 14 or 15') : `M${pad(s.mission)} ${MISSIONS[s.mission].name}`;
    el('title', {}, r).textContent = tip;
    r.addEventListener('click', () => onSpotClick(s));
  }

  renderPanel();
}

function arrowHead(s, size = 46) {
  const tx = s.x2, ty = s.y2, bx = tx - s.ux * size * 1.5, by = ty - s.uy * size * 1.5;
  const px = -s.uy * size * 0.8, py = s.ux * size * 0.8;
  return [[tx + s.ux * 6, ty + s.uy * 6], [bx + px, by + py], [bx - px, by - py]];
}

function renderPanel() {
  document.getElementById('total').textContent = total();
  const ol = document.getElementById('steps');
  ol.innerHTML = '';
  if (!path.length) {
    ol.innerHTML = '<li class="empty">No stops yet. Click the red or blue launch area to begin.</li>';
  }
  path.forEach((n, i) => {
    const li = document.createElement('li');
    const color = i === 0 ? LAUNCH[n.side].color : (n.kind === 'mission' ? COLORS.blue : COLORS.red);
    let text, pts = '';
    if (n.kind === 'launch') {
      li.className = 'launch';
      text = i === 0 ? `Start: ${LAUNCH[n.side].name}` : `Return to ${LAUNCH[n.side].name}`;
    } else {
      text = nodeLabel(n) + (n.revisit ? ' <span style="color:var(--muted)">(return trip)</span>' : '');
      pts = n.revisit ? '—' : '+' + n.points;
    }
    li.innerHTML = `<span class="n" style="background:${color}">${i + 1}</span><span class="t">${text}</span><span class="p">${pts}</span>`;
    ol.appendChild(li);
  });
  ol.scrollTop = ol.scrollHeight;
  document.getElementById('undoBtn').disabled = !path.length;
  document.getElementById('clearBtn').disabled = !path.length;
  setHint();
}

function setHint(msg) {
  const h = document.getElementById('hint');
  if (msg) { h.innerHTML = msg; return; }
  if (!path.length) h.innerHTML = '<b>Step 1:</b> Click the <b style="color:#d32f2f">red</b> or <b style="color:#1f6feb">blue</b> launch area in a bottom corner to choose where your robot starts.';
  else h.innerHTML = 'Click the next mission your robot will go to, or click a launch area to plan a return. Click <b>Calculate</b> when your plan is done.';
}

/* ---------- interaction ---------- */
function svgPoint(evt) {
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return { x: Math.round(p.x), y: Math.round(p.y) };
}

async function onLaunchClick(side, evt) {
  const { x, y } = svgPoint(evt);
  const L = LAUNCH[side];
  const last = path[path.length - 1];
  if (!path.length) {
    const ok = await modal({
      title: `Start in the ${L.name}?`,
      text: `Confirm the ${side} launch area as your robot's starting point.`,
      buttons: [{ label: 'Yes, start here', value: true, cls: 'ok' }, { label: 'Cancel', value: false, cls: 'cancel' }],
    });
    if (ok) { path.push({ kind: 'launch', side, x, y }); render(); }
    return;
  }
  if (last.kind === 'launch' && last.side === side) {
    setHint(`Your robot is already in the ${L.name}. Click a mission next.`);
    return;
  }
  const ok = await modal({
    title: last.kind === 'launch' ? `Move to the ${L.name}?` : `Return to the ${L.name}?`,
    text: 'This will add a red line to the launch area.',
    buttons: [{ label: 'Yes', value: true, cls: 'ok' }, { label: 'Cancel', value: false, cls: 'cancel' }],
  });
  if (ok) { path.push({ kind: 'launch', side, x, y }); render(); }
}

async function onSpotClick(s) {
  if (!path.length) { setHint('<b>Start in a launch area first.</b> Click the red or blue area in a bottom corner.'); return; }
  const last = path[path.length - 1];
  if (last.kind === 'mission' && last.spot === s.id) { setHint('Your robot is already at that mission. Pick a different spot.'); return; }

  let mission = s.mission;
  if (s.white) {
    const assign = whiteAssignments();
    mission = assign[s.id];
    if (!mission) {
      const taken = new Set(Object.values(assign));
      const options = [13, 14, 15].filter(m => !taken.has(m));
      mission = await modal({
        title: 'Which mission goes in this white box?',
        text: `Choose the mission you want to place in the ${s.label}.`,
        buttons: [
          ...options.map(m => ({ label: `M${m} – ${MISSIONS[m].name}`, value: m, cls: 'mis' })),
          { label: 'Cancel', value: null, cls: 'cancel' },
        ],
      });
      if (!mission) return;
    }
  }

  const M = MISSIONS[mission];
  const already = scoredPoints(mission);
  if (already !== null) {
    const ok = await modal({
      title: `M${pad(mission)} – ${M.name}`,
      text: `You already planned ${already} points here. Add a return trip to this mission? (No extra points.)`,
      buttons: [{ label: 'Add return trip', value: true, cls: 'ok' }, { label: 'Cancel', value: false, cls: 'cancel' }],
    });
    if (ok) { path.push({ kind: 'mission', spot: s.id, mission, points: 0, revisit: true }); render(); }
    return;
  }

  const points = await modal({
    title: `M${pad(mission)} – ${M.name}`,
    text: M.pts.length > 1 ? 'How many points do you plan to earn on this mission?' : `This mission is worth ${M.pts[0]} points. Add it to your plan?`,
    buttons: [
      ...M.pts.map(p => ({ label: p + ' pts', value: p, cls: 'pts' })),
      { label: 'Cancel', value: null, cls: 'cancel' },
    ],
  });
  if (points == null) return;
  path.push({ kind: 'mission', spot: s.id, mission, points, revisit: false });
  render();
}

/* ---------- modal ---------- */
function modal({ title, text, buttons, html, wide }) {
  return new Promise(resolve => {
    const ov = document.getElementById('overlay'), m = document.getElementById('modal');
    m.className = 'modal' + (wide ? ' result' : '');
    m.innerHTML = `<h2></h2>${text ? '<p></p>' : ''}${html || ''}<div class="choices"></div>`;
    m.querySelector('h2').textContent = title;
    if (text) m.querySelector('p').textContent = text;
    const c = m.querySelector('.choices');
    const close = v => { ov.classList.remove('show'); document.removeEventListener('keydown', esc); resolve(v); };
    const esc = e => { if (e.key === 'Escape') close(buttons.find(b => b.cls === 'cancel')?.value ?? null); };
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.textContent = b.label; if (b.cls) btn.className = b.cls;
      btn.onclick = () => { if (b.onClick) b.onClick(); else close(b.value); };
      c.appendChild(btn);
    }
    ov.onclick = e => { if (e.target === ov) close(buttons.find(b => b.cls === 'cancel')?.value ?? null); };
    document.addEventListener('keydown', esc);
    ov.classList.add('show');
    c.querySelector('button')?.focus();
  });
}

/* ---------- buttons ---------- */
document.getElementById('undoBtn').onclick = () => { path.pop(); render(); };
document.getElementById('clearBtn').onclick = async () => {
  const ok = await modal({ title: 'Start over?', text: 'This clears your whole plan.', buttons: [{ label: 'Yes, clear it', value: true, cls: 'ok' }, { label: 'Cancel', value: false, cls: 'cancel' }] });
  if (ok) { path = []; render(); }
};
document.getElementById('calcBtn').onclick = calculate;

/* ---------- export image ---------- */
function calculate() {
  if (!path.length) { setHint('<b>Nothing to calculate yet.</b> Start by clicking a launch area.'); return; }
  const img = document.getElementById('mapImg');
  const team = document.getElementById('team').value.trim();
  const run = document.getElementById('run').value.trim();

  const CW = 2400, s = CW / W, MH = Math.round(H * s);
  const HEAD = 150, PADX = 50, ROW = 50, COLS = 2;
  const rows = [
    { n: '', text: 'Precision tokens', pts: 50, color: '#888' },
    { n: '', text: 'Equipment inspection', pts: 20, color: '#888' },
    { n: '', text: 'M10 Fragile Microhabitats', pts: 20, color: '#888' },
  ];
  path.forEach((n, i) => {
    const color = i === 0 ? LAUNCH[n.side].color : (n.kind === 'mission' ? COLORS.blue : COLORS.red);
    if (n.kind === 'launch') rows.push({ n: i + 1, text: i === 0 ? 'Start: ' + LAUNCH[n.side].name : 'Return to ' + LAUNCH[n.side].name, pts: null, color });
    else rows.push({ n: i + 1, text: nodeLabel(n) + (n.revisit ? ' (return trip)' : ''), pts: n.revisit ? null : n.points, color });
  });
  const perCol = Math.ceil(rows.length / COLS);
  const LIST_H = 90 + perCol * ROW + 40;
  const CH = HEAD + MH + LIST_H;

  const cv = document.createElement('canvas');
  cv.width = CW; cv.height = CH;
  const ctx = cv.getContext('2d');
  const font = (w, px) => `${w} ${px}px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;

  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, CW, CH);
  // header
  ctx.fillStyle = '#1b2420'; ctx.fillRect(0, 0, CW, HEAD);
  ctx.fillStyle = '#fff'; ctx.font = font(800, 56); ctx.textBaseline = 'middle';
  ctx.fillText('FLL Mission Plan', PADX, 58);
  ctx.font = font(500, 36); ctx.fillStyle = '#cfd8d3';
  ctx.fillText([team, run].filter(Boolean).join('  •  ') || ' ', PADX, 112);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ff8a80'; ctx.font = font(600, 34);
  ctx.fillText('PLANNED TOTAL', CW - PADX, 44);
  ctx.fillStyle = '#fff'; ctx.font = font(800, 76);
  ctx.fillText(total() + ' pts', CW - PADX, 104);
  ctx.textAlign = 'left';

  // map
  ctx.save();
  ctx.translate(0, HEAD);
  ctx.drawImage(img, 0, 0, CW, MH);
  ctx.scale(s, s);
  const assign = whiteAssignments();
  const visited = new Set(path.filter(n => n.kind === 'mission').map(n => n.spot));
  for (const sp of SPOTS) {
    if (visited.has(sp.id)) {
      ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 12;
      roundRect(ctx, sp.x - BOX / 2 - 14, sp.y - BOX / 2 - 14, BOX + 28, BOX + 28, 34); ctx.stroke();
    }
    if (sp.white && assign[sp.id]) {
      ctx.fillStyle = '#c62828'; ctx.font = font(800, 112); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pad(assign[sp.id]), sp.x, sp.y + 4);
    }
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const sg of segments()) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 26; line(ctx, sg);
    ctx.strokeStyle = sg.color; ctx.lineWidth = 15; line(ctx, sg);
    const ah = arrowHead(sg);
    ctx.beginPath(); ctx.moveTo(...ah[0]); ctx.lineTo(...ah[1]); ctx.lineTo(...ah[2]); ctx.closePath();
    ctx.fillStyle = sg.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.stroke();
    const mx = (sg.x1 + sg.x2) / 2, my = (sg.y1 + sg.y2) / 2;
    ctx.beginPath(); ctx.arc(mx, my, 38, 0, Math.PI * 2); ctx.fillStyle = sg.color; ctx.fill();
    ctx.lineWidth = 7; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = font(800, 48); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(sg.step, mx, my + 2);
  }
  path.forEach((n, i) => {
    if (n.kind !== 'launch') return;
    ctx.beginPath(); ctx.arc(n.x, n.y, i === 0 ? 40 : 28, 0, Math.PI * 2);
    ctx.fillStyle = LAUNCH[n.side].color; ctx.fill(); ctx.lineWidth = 9; ctx.strokeStyle = '#fff'; ctx.stroke();
  });
  ctx.restore();

  // list
  const top = HEAD + MH;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#1b2420'; ctx.font = font(800, 40);
  ctx.fillText('Mission order & planned points', PADX, top + 52);
  const colW = (CW - PADX * 2) / COLS;
  rows.forEach((r, i) => {
    const col = Math.floor(i / perCol), row = i % perCol;
    const x = PADX + col * colW, y = top + 110 + row * ROW;
    if (row % 2 === 0) { ctx.fillStyle = '#f2f4f1'; ctx.fillRect(x - 10, y - ROW / 2, colW - 30, ROW); }
    if (r.n !== '') {
      ctx.beginPath(); ctx.arc(x + 18, y, 18, 0, Math.PI * 2); ctx.fillStyle = r.color; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = font(800, 20); ctx.textAlign = 'center'; ctx.fillText(r.n, x + 18, y + 1);
    } else {
      ctx.fillStyle = '#888'; ctx.font = font(700, 22); ctx.textAlign = 'center'; ctx.fillText('★', x + 18, y + 1);
    }
    ctx.textAlign = 'left'; ctx.fillStyle = '#1b2420'; ctx.font = font(500, 30);
    ctx.fillText(r.text, x + 50, y + 1);
    ctx.textAlign = 'right'; ctx.font = font(800, 30);
    ctx.fillText(r.pts == null ? '—' : r.pts, x + colW - 50, y + 1);
    ctx.textAlign = 'left';
  });

  let url;
  try { url = cv.toDataURL('image/png'); }
  catch (e) {
    modal({ title: 'Can’t make the image here', text: 'Your browser blocked the image because the page was opened as a file. Open the planner from its GitHub Pages web address and try again.', buttons: [{ label: 'OK', value: true, cls: 'ok' }] });
    return;
  }
  const fname = ((team || 'fll') + '-' + (run || 'mission-plan')).replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() + '.png';
  modal({
    title: `Planned total: ${total()} points`,
    html: `<img src="${url}" alt="Mission plan image">`,
    wide: true,
    buttons: [
      { label: '⬇ Download image', cls: 'ok', onClick: () => { const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); } },
      { label: 'Close', value: null, cls: 'cancel' },
    ],
  });
}
function line(ctx, s) { ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke(); }
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

render();
</script>
</body>
